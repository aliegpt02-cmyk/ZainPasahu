publishing:
  email:
    recipients:
      - aliegpt02-cmyk@github.com
    notify:
      success: true
      failure: true

workflows:
  android-workflow:
    name: Android Live APK Build
    max_build_duration: 10
    instance_type: mac_mini_m1
    environment:
      groups:
        - sdk
      vars:
        JAVA_HOME: "/Library/Java/JavaVirtualMachines/zulu-11.jdk/Contents/Home"
    triggering:
      events:
        - push
    scripts:
      - name: Clean and Prepare Environment
        script: |
          export JAVA_HOME=$JAVA_HOME
          
          # إجبار السيرفر على مسح أي ملفات توليد قديمة معلقة في الجذور الخارجية
          rm -f AndroidManifest.xml MainActivity.java build.gradle settings.gradle gradle.properties
          
          # بناء محرك التشغيل التنفيذي النظيف
          gradle wrapper --gradle-version 7.5

      - name: Build Android Debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
