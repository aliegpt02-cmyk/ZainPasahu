publishing:
  email:
    recipients:
      - aliegpt02-cmyk@github.com
    notify:
      success: true
      failure: true

workflows:
  android-workflow:
    name: Android Live APK Build
    max_build_duration: 10
    instance_type: mac_mini_m1
    environment:
      groups:
        - sdk
      vars:
        JAVA_HOME: "/Library/Java/JavaVirtualMachines/zulu-11.jdk/Contents/Home"
    triggering:
      events:
        - push
    scripts:
      - name: Build Android Debug APK
        script: |
          export JAVA_HOME=$JAVA_HOME
          
          # 1. تنظيف وتطهير شامل لبيئة السيرفر لقتل الملفات القديمة المعلقة
          rm -rf app build.gradle settings.gradle gradle.properties gradlew .gradle
          mkdir -p app/src/main/java/com/zain/pasahu
          
          # 2. نقل ملف الجافا التفاعلي الحقيقي إلى مساره البرمجي الصحيح
          if [ -f MainActivity.java ]; then
            mv MainActivity.java app/src/main/java/com/zain/pasahu/MainActivity.java
          fi
          
          # 3. إعادة توليد المانيفست بالصلاحيات الأمنية الكاملة للبلوتوث المزدوج
          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://android.com" package="com.zain.pasahu">
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <application android:label="ZAIN PASAHU" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # 4. كتابة الـ build.gradle بالصيغة القياسية والمستقرة المتوافقة مع أداة البناء 4.1.3
          cat <<'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          
          android {
              compileSdkVersion 30
              buildToolsVersion "30.0.3"
              
              defaultConfig {
                  applicationId "com.zain.pasahu"
                  minSdkVersion 21
                  targetSdkVersion 30
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.3.1'
              implementation 'com.google.android.material:material:1.4.0'
          }
          EOF
          
          # 5. توليد الجذور الخارجية الصافية لضبط الهيكل
          cat <<'EOF' > settings.gradle
          rootProject.name = "ZainPasahu"
          include ':app'
          EOF
          
          cat <<'EOF' > build.gradle
          buildscript {
              repositories { google() ; mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:4.1.3' }
          }
          allprojects { repositories { google() ; mavenCentral() } }
          EOF
          
          cat <<'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          
          # 6. توليد ملفات المحرك وبدء التجميع الفوري
          gradle wrapper --gradle-version 6.5
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      
