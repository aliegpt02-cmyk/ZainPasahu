publishing:
  email:
    recipients:
      - aliegpt02-cmyk@github.com
    notify:
      success: true
      failure: true

workflows:
  android-workflow:
    name: Android Live APK Build
    max_build_duration: 10
    instance_type: mac_mini_m1
    environment:
      groups:
        - sdk
      vars:
        PACKAGE_NAME: "com.zain.pasahu"
        JAVA_HOME: "/Library/Java/JavaVirtualMachines/zulu-11.jdk/Contents/Home"
    triggering:
      events:
        - push
    scripts:
      - name: Build Android Debug APK
        script: |
          export JAVA_HOME=$JAVA_HOME
          
          # توليد ملفات المحرك التنفيذي تلقائياً داخل السحابة وتخطي خطأ 127
          gradle wrapper --gradle-version 6.5
          
          # منح صلاحيات التشغيل الصارمة للمحرك والبدء بالتجميع الفوري
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
