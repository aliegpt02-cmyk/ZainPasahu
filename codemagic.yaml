publishing:
  email:
    recipients:
      - aliegpt02-cmyk@github.com
    notify:
      success: true
      failure: true

workflows:
  android-workflow:
    name: Android Live APK Build
    max_build_duration: 10
    instance_type: mac_mini_m1
    environment:
      groups:
        - sdk
      vars:
        PACKAGE_NAME: "com.zain.pasahu"
        JAVA_HOME: "/Library/Java/JavaVirtualMachines/zulu-11.jdk/Contents/Home"
    triggering:
      events:
        - push
    scripts:
      - name: Initialize Android Structure
        script: |
          export JAVA_HOME=$JAVA_HOME
          
          # إنشاء هيكل مجلدات التطبيق الداخلي المتوافق
          mkdir -p app/src/main/java/com/zain/pasahu
          
          # تأمين نقل ملف الجافا للمسار البرمجي الصحيح
          if [ -f MainActivity.java ]; then
            mv MainActivity.java app/src/main/java/com/zain/pasahu/MainActivity.java
          fi
          
          # توليد ملفات الضبط للمشروع الحديث لتخطي فحص الجذور
          cat <<'EOF' > settings.gradle
          rootProject.name = "ZainPasahu"
          include ':app'
          EOF
          
          cat <<'EOF' > build.gradle
          buildscript {
              repositories { google() ; mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
          }
          allprojects { repositories { google() ; mavenCentral() } }
          EOF
          
          cat <<'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              compileSdkVersion 33
              defaultConfig {
                  applicationId "com.zain.pasahu"
                  minSdkVersion 21
                  targetSdkVersion 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF
          
          # توليد محرك التشغيل التنفيذي المتوافق مع البيئة الحديثة
          gradle wrapper --gradle-version 7.5

      - name: Build Android Debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
